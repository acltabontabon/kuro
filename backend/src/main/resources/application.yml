spring:
  datasource:
    # foreign_keys=true is mandatory: SQLite does not enforce FKs by default.
    url: jdbc:sqlite:data/kuro.db?foreign_keys=true
    driver-class-name: org.sqlite.JDBC
  jpa:
    # Community dialects are not auto-detected by Hibernate.
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate # Flyway owns the schema
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
